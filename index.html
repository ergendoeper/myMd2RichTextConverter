  <script>
    /**
     * Sichere Parsing-Engine:
     * Unterstützt Confluence Jira-Tabellensyntax (|| Header || und | Cell |),
     * Links ([Text|URL] und [URL]), Task-Listen, Blockquotes und Headers.
     */
    class SecureDocConverter {
      // 1. Sicheres Escapen aller HTML-Entities zur Unterbindung von Injections
      static escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // 2. Striktes Whitelisting von URL-Schemata
      static sanitizeUrl(url) {
        const clean = url.trim();
        if (/^(https?:|mailto:)/i.test(clean)) {
          return this.escapeHtml(clean);
        }
        return "#"; // Fallback bei gefährlichen Protokollen (z.B. javascript:)
      }

      // 3. Inline-Formatierungen parsen
      static parseInline(text) {
        // Links: [Label|URL] oder [Label]
        text = text.replace(/\[([^\Vert{}\]]+)\|([^\]]+)\]/g, (match, label, url) => {
          const safeUrl = this.sanitizeUrl(url);
          return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${this.escapeHtml(label)}</a>`;
        });
        text = text.replace(/\[([^\]]+)\]/g, (match, content) => {
          // Check ob es sich um eine URL handelt
          if (/^https?:\/\//i.test(content)) {
            const safeUrl = this.sanitizeUrl(content);
            return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeUrl}</a>`;
          }
          return `[${this.escapeHtml(content)}]`;
        });

        // Bold
        text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        // Italic (Markdown und Jira-Syntax //text//)
        text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        text = text.replace(/\/\/([^/]+)\/\//g, '<em>$1</em>');

        return text;
      }

      // 4. Haupt-Parser
      static convert(rawText) {
        const lines = rawText.split(/\r?\n/);
        let html = [];
        let inTable = false;
        const listIndents = [];
        let inQuote = false;

        const closeBlocks = () => {
          if (inTable) { html.push('</tbody></table>'); inTable = false; }
          while (listIndents.length) {
            if (listIndents[listIndents.length - 1].itemOpen) html.push('</li>');
            html.push('</ul>');
            listIndents.pop();
          }
          if (inQuote) { html.push('</blockquote>'); inQuote = false; }
        };

        for (let i = 0; i < lines.length; i++) {
          const rawLine = lines[i];
          let line = rawLine.trim();

          // Leere Zeile
          if (!line) {
            closeBlocks();
            continue;
          }

          // Trennlinie
          if (/^---$\vert{}^\*\*\*$/.test(line)) {
            closeBlocks();
            html.push('<hr>');
            continue;
          }

          // Headings (#, ##, ###)
          const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
          if (headingMatch) {
            closeBlocks();
            const level = headingMatch[1].length;
            const content = this.parseInline(this.escapeHtml(headingMatch[2]));
            html.push(`<h${level}>${content}</h${level}>`);
            continue;
          }

          // Blockquote (>)
          if (line.startsWith('>')) {
            if (inTable || listIndents.length) closeBlocks();
            if (!inQuote) {
              html.push('<blockquote>');
              inQuote = true;
            }
            const cleanLine = line.replace(/^>\s?/, '');
            html.push(`<p>${this.parseInline(this.escapeHtml(cleanLine))}</p>`);
            continue;
          } else if (inQuote) {
            html.push('</blockquote>');
            inQuote = false;
          }

          // Listen / Checklisten
          const listMatch = rawLine.match(/^([ \t]*)-\s+(\[\s*\]|[x])?\s*(.*)$/i);
          if (listMatch) {
            if (inTable || inQuote) closeBlocks();
            const indent = listMatch[1].replace(/\t/g, '    ').length;
            if (!listIndents.length) {
              html.push('<ul>');
              listIndents.push({ indent, itemOpen: false });
            } else if (indent > listIndents[listIndents.length - 1].indent) {
              html.push('<ul>');
              listIndents.push({ indent, itemOpen: false });
            } else {
              while (indent < listIndents[listIndents.length - 1].indent) {
                if (listIndents[listIndents.length - 1].itemOpen) html.push('</li>');
                html.push('</ul>');
                listIndents.pop();
              }
            }
            const currentList = listIndents[listIndents.length - 1];
            if (currentList.itemOpen) html.push('</li>');
            let checkPrefix = '';
            if (listMatch[2]) {
              const isChecked = listMatch[2].toLowerCase().includes('x');
              checkPrefix = isChecked ? '☑ ' : '☐ ';
            }
            const content = this.parseInline(this.escapeHtml(listMatch[3]));
            html.push(`<li>${checkPrefix}${content}`);
            currentList.itemOpen = true;
            continue;
          } else if (listIndents.length) {
            while (listIndents.length) {
              if (listIndents[listIndents.length - 1].itemOpen) html.push('</li>');
              html.push('</ul>');
              listIndents.pop();
            }
          }

          // Tabellen: Unterstützt Jira-Markup (|| Header || und | Zelle |)
          if (line.startsWith('|')) {
            if (inQuote || listIndents.length) closeBlocks();

            const isHeaderRow = line.startsWith('||');
            if (!inTable) {
              html.push('<table><tbody>');
              inTable = true;
            }

            // Zellen splitten unter Berücksichtigung von || oder |
            let cells = [];
            if (isHeaderRow) {
              cells = line.split('||').map(c => c.trim()).filter((c, idx, arr) => idx > 0 && idx < arr.length);
            } else {
              cells = line.split('|').map(c => c.trim()).filter((c, idx, arr) => idx > 0 && idx < arr.length);
            }

            // Ignoriere Markdown-Separator-Zeilen wie |--|--|
            if (cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c))) {
              continue;
            }

            html.push('<tr>');
            cells.forEach(cell => {
              const parsed = this.parseInline(this.escapeHtml(cell));
              if (isHeaderRow) {
                html.push(`<th>${parsed}</th>`);
              } else {
                html.push(`<td>${parsed}</td>`);
              }
            });
            html.push('</tr>');
            continue;
          } else if (inTable) {
            html.push('</tbody></table>');
            inTable = false;
          }

          // Standard Paragraphen
          const textContent = this.parseInline(this.escapeHtml(line));
          html.push(`<p>${textContent}</p>`);
        }

        closeBlocks();
        return html.join('\n');
      }
    }

    // DOM Wiring
    const rawInput = document.getElementById('raw-input');
    const previewOutput = document.getElementById('preview-output');
    const inputStats = document.getElementById('input-stats');
    const btnCopy = document.getElementById('btn-copy');
    const btnLoadTemplate = document.getElementById('btn-load-template');
    const toast = document.getElementById('toast');

    function updateView() {
      const text = rawInput.value;
      inputStats.textContent = `${text.length} Zeichen`;
      const html = SecureDocConverter.convert(text);
      previewOutput.innerHTML = html;
    }

    rawInput.addEventListener('input', updateView);

    btnLoadTemplate.addEventListener('click', () => {
      rawInput.value = TEMPLATE_TEXT;
      updateView();
    });

    // Rich-Text Copy via Clipboard API
    btnCopy.addEventListener('click', async () => {
      const htmlContent = previewOutput.innerHTML;
      const plainTextContent = previewOutput.innerText;

      if (!htmlContent.trim()) return;

      try {
        const blobHtml = new Blob([htmlContent], { type: 'text/html' });
        const blobText = new Blob([plainTextContent], { type: 'text/plain' });
        
        const clipboardItem = new ClipboardItem({
          'text/html': blobHtml,
          'text/plain': blobText
        });

        await navigator.clipboard.write([clipboardItem]);
        
        toast.style.display = 'block';
        setTimeout(() => {
          toast.style.display = 'none';
        }, 2500);
      } catch (err) {
        console.error('Clipboard-API fehlgeschlagen:', err);
        // Fallback über Selection Range falls Permissions fehlen
        const range = document.createRange();
        range.selectNodeContents(previewOutput);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
        sel.removeAllRanges();
        alert('Rich-Text in Zwischenablage kopiert (Fallback).');
      }
    });

    // Initialer Load
    rawInput.value = TEMPLATE_TEXT;
    updateView();
  </script>
